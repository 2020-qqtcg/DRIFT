[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drift"
version = "0.1.0"
description = "Multi-turn trajectory data generation, evaluation, and weighted SFT."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=1.12.0,<1.13.0",
    "datasets>=4.4.0,<4.5.0",
    "deepspeed>=0.18.0,<0.19.0",
    "matplotlib>=3.10.0,<3.11.0",
    "numpy>=2.2.0,<3.0.0",
    "peft>=0.18.0,<0.19.0",
    "sympy>=1.14.0,<2.0.0",
    "torch>=2.7.0,<2.8.0",
    "tqdm>=4.67.0,<5.0.0",
    "transformers>=4.57.0,<4.58.0",
    "vllm>=0.10.0,<0.11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = []

[tool.uv]
package = false
